name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  API_URL: https://cineray-api.fly.dev
  FRONT_URL: https://ticket-challenge.vercel.app

jobs:
  verify-production:
    name: Verificar produção
    runs-on: ubuntu-latest
    steps:
      - name: Aguardar deploy (Vercel/Fly)
        run: sleep 45

      - name: Health check API (Fly)
        run: |
          set -e
          for i in $(seq 1 12); do
            code=$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 45 \
              "$API_URL/health" || true)
            body=$(cat /tmp/health.json 2>/dev/null || true)
            echo "attempt=$i http=$code body=$body"
            if [ "$code" = "200" ] && echo "$body" | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 15
          done
          echo "API health check falhou"
          exit 1

      - name: API catalog
        run: |
          set -e
          for i in $(seq 1 10); do
            code=$(curl -sS -o /tmp/movies.json -w "%{http_code}" --max-time 45 \
              "$API_URL/api/movies" || true)
            body=$(cat /tmp/movies.json 2>/dev/null || true)
            echo "attempt=$i http=$code body=$(echo "$body" | head -c 200)"
            if [ "$code" = "200" ] && echo "$body" | grep -q '"movies"'; then
              exit 0
            fi
            sleep 12
          done
          echo "API catalog check falhou"
          exit 1

      - name: Front no ar (Vercel)
        run: |
          set -e
          for i in $(seq 1 8); do
            code=$(curl -sS -o /tmp/front.html -w "%{http_code}" --max-time 45 \
              "$FRONT_URL/" || true)
            echo "attempt=$i front http=$code"
            if [ "$code" = "200" ] && grep -qi 'cineray\|root\|vite' /tmp/front.html; then
              exit 0
            fi
            sleep 12
          done
          echo "Front check falhou"
          exit 1
