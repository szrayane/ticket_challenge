services:
  - type: web
    name: cineray-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    # initDb aplica migrations pendentes no boot; seed demo pode ser desligado com DISABLE_SEED=1
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: STAFF_INVITE_CODE
        generateValue: true
      - key: TICKET_QR_SECRET
        generateValue: true
      - key: TMDB_API_KEY
        sync: false
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "3306"
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        sync: false
