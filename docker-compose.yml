services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cineray
      MYSQL_USER: cineray
      MYSQL_PASSWORD: cineray
    ports:
      - "3306:3306"
    volumes:
      - cineray-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ./backend
    ports:
      - "3333:3333"
    environment:
      PORT: 3333
      NODE_ENV: production
      STAFF_INVITE_CODE: cineray-staff
      TICKET_QR_SECRET: cineray-qr-compose-secret
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: cineray
      MYSQL_PASSWORD: cineray
      MYSQL_DATABASE: cineray
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      args:
        VITE_APP_API_URL: http://localhost:3333/api
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  cineray-mysql:
